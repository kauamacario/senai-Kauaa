<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Formulário Inteligente CEP</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body{
      background: linear-gradient(135deg,#0d6efd,#6610f2);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,sans-serif;
    }

    .card-custom{
      width:100%;
      max-width:850px;
      border:none;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }

    .card-header{
      background:#0d6efd;
      color:#fff;
      text-align:center;
      padding:25px;
    }

    .btn-custom{
      background:#6610f2;
      border:none;
    }

    .btn-custom:hover{
      background:#520dc2;
    }

    .form-control:focus,
    .form-select:focus{
      border-color:#6610f2;
      box-shadow:0 0 0 .2rem rgba(102,16,242,.25);
    }

    .resultado{
      display:none;
      margin-top:20px;
      background:#f8f9fa;
      border-left:5px solid #0d6efd;
      border-radius:10px;
      padding:15px;
    }

  </style>

</head>

<body>

<div class="card card-custom">

  <div class="card-header">

    <h2>Consulta Inteligente de CEP</h2>

    <p class="mb-0">
      Formulário moderno com Bootstrap
    </p>

  </div>

  <div class="card-body p-4">

    <form id="formCEP">

      <!-- CEP -->
      <div class="mb-3">

        <label class="form-label">
          CEP
        </label>

        <div class="input-group">

          <span class="input-group-text">
            📍
          </span>

          <input
            type="text"
            class="form-control"
            id="cep"
            placeholder="00000-000"
            maxlength="9"
            required
          >

        </div>

      </div>

      <div class="row">

        <!-- Rua -->
        <div class="col-md-8 mb-3">

          <label class="form-label">
            Nome da Rua
          </label>

          <input
            type="text"
            class="form-control"
            id="rua"
          >

        </div>

        <!-- Número -->
        <div class="col-md-4 mb-3">

          <label class="form-label">
            Número
          </label>

          <input
            type="number"
            class="form-control"
            id="numero"
          >

        </div>

      </div>

      <div class="row">

        <!-- Bairro -->
        <div class="col-md-6 mb-3">

          <label class="form-label">
            Bairro
          </label>

          <input
            type="text"
            class="form-control"
            id="bairro"
          >

        </div>

        <!-- Referência -->
        <div class="col-md-6 mb-3">

          <label class="form-label">
            Ponto de Referência
          </label>

          <input
            type="text"
            class="form-control"
            id="referencia"
          >

        </div>

      </div>

      <div class="row">

        <!-- Cidade -->
        <div class="col-md-6 mb-3">

          <label class="form-label">
            Cidade
          </label>

          <input
            type="text"
            class="form-control"
            id="cidade"
          >

        </div>

        <!-- Estado -->
        <div class="col-md-6 mb-3">

          <label class="form-label">
            Estado
          </label>

          <select class="form-select" id="estado">

            <option selected>
              Selecione
            </option>

            <option>RJ</option>
            <option>SP</option>
            <option>MG</option>
            <option>BA</option>

          </select>

        </div>

      </div>

      <!-- Tipo -->
      <div class="mb-3">

        <label class="form-label d-block">
          Tipo de Endereço
        </label>

        <div class="form-check form-check-inline">

          <input
            class="form-check-input"
            type="radio"
            name="tipo"
            checked
          >

          <label class="form-check-label">
            Residencial
          </label>

        </div>

        <div class="form-check form-check-inline">

          <input
            class="form-check-input"
            type="radio"
            name="tipo"
          >

          <label class="form-check-label">
            Comercial
          </label>

        </div>

      </div>

      <!-- Switch -->
      <div class="form-check form-switch mb-3">

        <input
          class="form-check-input"
          type="checkbox"
          id="switch"
        >

        <label class="form-check-label">
          Receber notificações
        </label>

      </div>

      <!-- Checkbox -->
      <div class="form-check mb-4">

        <input
          class="form-check-input"
          type="checkbox"
          required
        >

        <label class="form-check-label">
          Confirmo os dados informados
        </label>

      </div>

      <!-- Botões -->
      <div class="d-grid gap-2">

        <button
          type="button"
          class="btn btn-primary btn-custom"
          onclick="buscarCEP()"
        >
          Buscar CEP
        </button>

        <button
          type="reset"
          class="btn btn-outline-secondary"
        >
          Limpar
        </button>

        <button
          type="submit"
          class="btn btn-success"
        >
          Salvar
        </button>

      </div>

    </form>

    <!-- Resultado -->
    <div class="resultado" id="resultado">

      <h5>
        Resultado da Consulta
      </h5>

      <p>
        <strong>CEP:</strong>
        <span id="resultadoCEP"></span>
      </p>

    </div>

  </div>

</div>

<script>

  // Máscara CEP
  document
    .getElementById('cep')
    .addEventListener('input', function(e){

      let valor =
        e.target.value.replace(/\D/g,'');

      valor =
        valor.replace(/(\d{5})(\d)/,'$1-$2');

      e.target.value = valor;

  });

  // Buscar CEP
  async function buscarCEP(){

    const cep =
      document
      .getElementById('cep')
      .value
      .replace(/\D/g,'');

    if(cep.length !== 8){

      alert('Digite um CEP válido');
      return;

    }

    try{

      const response =
        await fetch(`https://viacep.com.br/ws/${cep}/json/`);

      const data =
        await response.json();

      if(data.erro){

        alert('CEP não encontrado');
        return;

      }

      document.getElementById('rua').value =
        data.logradouro;

      document.getElementById('bairro').value =
        data.bairro;

      document.getElementById('cidade').value =
        data.localidade;

      document.getElementById('estado').value =
        data.uf;

      document.getElementById('resultado').style.display =
        'block';

      document.getElementById('resultadoCEP').innerText =
        data.cep;

    }catch(error){

      console.error(error);

      alert('Erro ao buscar CEP');

    }

  }

  // Submit
  document
    .getElementById('formCEP')
    .addEventListener('submit', function(e){

      e.preventDefault();

      alert('Cadastro salvo com sucesso!');

  });

</script>

</body>
</html>
